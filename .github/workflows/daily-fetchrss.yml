# This is a basic workflow to help you get started with Actions

name: Fetch devblog

# Controls when the workflow will run

on:
  schedule:
  - cron: "11 0 * * 2-6"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      issues: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore scraper dependencies
        run: dotnet restore ./src/scrapecsharp/scrapsummary/scraper/scraper.csproj

      - name: Build scraper
        run: dotnet build ./src/scrapecsharp/scrapsummary/scraper/scraper.csproj --configuration Release --no-restore

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-dotnet-${{ runner.os }}-chromium-${{ hashFiles('src/scrapecsharp/scrapsummary/scraper/**/*.csproj', 'src/scrapecsharp/scrapsummary/scraper/**/*.props', 'src/scrapecsharp/scrapsummary/scraper/**/*.targets') }}

      - name: Install Playwright browsers
        run: ./src/scrapecsharp/scrapsummary/scraper/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
        shell: pwsh

      - name: Sync Feeds
        run: dotnet run --project ./src/scrapecsharp/scrapsummary/scraper/scraper.csproj --configuration Release --no-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pusher.name }}
          OPENAI_API_TOKEN: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_DEPLOY: ${{ secrets.OPENAI_API_DEPLOY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
